# ThinkPad L560 bench config: the shared head-unit config, plus the laptop's
# own panel scaled so the UI sees the COMAND panel's 230 px height
# (1080 / 4.69 = 230), and COMAND's own mode on its output. See docs/vga-to-comand.md.
include /usr/local/share/comand-ui/sway-headunit.conf
output eDP-1 scale 4.69
# Nothing on the laptop's own screen: the UI belongs on COMAND.
output eDP-1 disable
output DP-2 modeline 12.60 640 656 716 804 230 239 241 261 -hsync -vsync

# Two outputs here, one on the Pi: without this sway puts a workspace on whichever
# output is focused when it first appears, and CarPlay landed on the laptop's own
# panel while COMAND kept showing the menu. Every source belongs on COMAND's input.
workspace 1 output DP-2
workspace 2 output DP-2
workspace 3 output DP-2
workspace 4 output DP-2
workspace 5 output DP-2
assign [app_id="comand-video"] workspace 5

# COMAND picture settings (brightness, contrast, gamma, colour balance) as the
# gamma tables of the output that feeds COMAND's RGB input. Restarted if it
# exits: sway drops the tables with the client, and an output that comes back
# (re-plug, mode change) needs them again.
exec sh -c 'while :; do python3 /usr/local/share/comand-ui/video/comand-video.py --output DP-2; sleep 5; done'
