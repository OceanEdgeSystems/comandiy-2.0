<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" fill="#1b2330">
<title>6. Laptop power in the car</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker></defs>
<rect width="960" height="420" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="600">6. Laptop power in the car</text>
<rect x="40" y="110" width="180" height="110" rx="4" fill="#f5f7fa" stroke="#1b2330" stroke-width="1.5"/><text x="130.0" y="161.0" text-anchor="middle" font-weight="600">Car 12 V</text><text x="130.0" y="179.0" text-anchor="middle" font-size="12" fill="#5b6675">battery feed</text><rect x="300" y="130" width="80" height="70" rx="4" fill="#f5f7fa" stroke="#c0392b" stroke-width="1.5"/><text x="340.0" y="161.0" text-anchor="middle" font-weight="600">Fuse</text><text x="340.0" y="179.0" text-anchor="middle" font-size="12" fill="#5b6675">at the source</text><rect x="460" y="110" width="190" height="110" rx="4" fill="#f5f7fa" stroke="#1b2330" stroke-width="1.5"/><text x="555.0" y="152.0" text-anchor="middle" font-weight="600">12 V to 20 V</text><text x="555.0" y="170.0" text-anchor="middle" font-size="12" fill="#5b6675">laptop car adapter</text><text x="555.0" y="188.0" text-anchor="middle" font-size="12" fill="#5b6675">65 W or more</text><rect x="730" y="110" width="190" height="110" rx="4" fill="#fbf7ea" stroke="#a8821a" stroke-width="1.5"/><text x="825.0" y="152.0" text-anchor="middle" font-weight="600">ThinkPad L560</text><text x="825.0" y="170.0" text-anchor="middle" font-size="12" fill="#5b6675">own battery holds it</text><text x="825.0" y="188.0" text-anchor="middle" font-size="12" fill="#5b6675">through engine crank</text><polyline points="220,165 300,165" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/><polyline points="380,165 460,165" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/><polyline points="650,165 730,165" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/><text x="40" y="270" text-anchor="start" fill="#1b2330" font-size="14" font-weight="400">When power is lost the laptop stays up for 1 hour on its battery, then sleeps. Below 8 % it sleeps early.</text><text x="40" y="296" text-anchor="start" fill="#1b2330" font-size="14" font-weight="400">After a wake on battery it stays up for 10 minutes. The hold is set in comand-power.py.</text><text x="40" y="330" text-anchor="start" fill="#c0392b" font-size="13" font-weight="600">Check before relying on it: does your laptop wake by itself when car power returns? This has not been</text><text x="40" y="350" text-anchor="start" fill="#c0392b" font-size="13" font-weight="600">proven on the road. COMAND's own power does not change.</text></svg>
