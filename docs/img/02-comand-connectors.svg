 text-anchor="middle" font-size="9" fill="#fff">RB-CAN</text><text x="838" y="203" text-anchor="middle" font-size="9" fill="#fff">Lo</text><rect x="868" y="162" width="52" height="46" rx="3" fill="#2f62b5" stroke="#2f62b5" stroke-width="1.5"/><text x="894" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">18</text><text x="894" y="193" text-anchor="middle" font-size="9" fill="#fff">RB-CAN</text><text x="894" y="203" text-anchor="middle" font-size="9" fill="#fff">Hi</text><text x="40" y="262" text-anchor="start" fill="#1b2330" font-size="15" font-weight="600">Colour key</text><rect x="40" y="276" width="18" height="18" fill="#c0392b"/><text x="68" y="290" text-anchor="start" fill="#1b2330" font-size="13" font-weight="400">Video: diagram 3</text><rect x="40" y="302" width="18" height="18" fill="#2f62b5"/><text x="68" y="316" text-anchor="start" fill="#1b2330" font-size="13" font-weight="400">Media bus CAN (needed): diagram 4</text><rect x="40" y="328" width="18" height="18" fill="#2d8a4e"/><text x="68" y="342" text-anchor="start" fill="#1b2330" font-size="13" font-weight="400">Sound into COMAND: diagram 5</text><rect x="40" y="354" width="18" height="18" fill="#a8821a"/><text x="68" y="368" text-anchor="start" fill="#1b2330" font-size="13" font-weight="400">Interior CAN-B: optional and experimental, leave off at first</text><text x="40" y="400" text-anchor="start" fill="#1b2330" font-size="15" font-weight="600">Main connector: do not change it</text><text x="40" y="424" text-anchor="start" fill="#1b2330" font-size="13" font-weight="400">Power, ground and speakers stay as the car has them: +12 V battery (circuit 30), +12 V switched (15R),</text><text x="40" y="444" text-anchor="start" fill="#1b2330" font-size="13" font-weight="400">illumination (58), ground (31). The unit's fuse sits next to this connector.</text><text x="40" y="482" text-anchor="start" fill="#5b6675" font-size="12" font-weight="400">Pin names from a published COMAND 2.0 connector legend. Other model years may differ.</text></svg>
