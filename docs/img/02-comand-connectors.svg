<text x="24" y="34" font-size="20" font-weight="600">2. COMAND 2.0 rear connectors: pins this install uses</text>
<text x="24" y="58" text-anchor="start" fill="#5b6675" font-size="13" font-weight="400">Viewed from the back of the unit. Layout is schematic: confirm each pin with a meter before you connect anything.</text><text x="40" y="98" text-anchor="start" fill="#1b2330" font-size="15" font-weight="600">TV / RGB block (8 pins)</text><rect x="40" y="112" width="74" height="46" rx="3" fill="#c0392b" stroke="#c0392b"/><text x="77" y="140" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">RGB GND</text><rect x="120" y="112" width="74" height="46" rx="3" fill="#c0392b" stroke="#c0392b"/><text x="157" y="140" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">B</text><rect x="200" y="112" width="74" height="46" rx="3" fill="#c0392b" stroke="#c0392b"/><text x="237" y="140" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">G</text><rect x="280" y="112" width="74" height="46" rx="3" fill="#c0392b" stroke="#c0392b"/><text x="317" y="140" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">R</text><rect x="40" y="162" width="74" height="46" rx="3" fill="#c0392b" stroke="#c0392b"/><text x="77" y="190" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">RGB A.G.</text><rect x="120" y="162" width="74" height="46" rx="3" fill="#c0392b" stroke="#c0392b"/><text x="157" y="190" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">RGB Sync</text><rect x="200" y="162" width="74" height="46" rx="3" fill="#fff" stroke="#c7cfd9"/><text x="237" y="190" text-anchor="middle" fill="#5b6675" font-size="12" font-weight="600">CD pwr +</text><rect x="280" y="162" width="74" height="46" rx="3" fill="#fff" stroke="#c7cfd9"/><text x="317" y="190" text-anchor="middle" fill="#5b6675" font-size="12" font-weight="600">CD pwr -</text><text x="40" y="230" text-anchor="start" fill="#c0392b" font-size="12" font-weight="600">RGB A.G. must be connected: without it the picture is flat grey.</text><text x="420" y="98" text-anchor="start" fill="#1b2330" font-size="15" font-weight="600">Connector C2 (18 pins)</text><rect x="420" y="112" width="52" height="46" rx="3" fill="#fff" stroke="#c7cfd9" stroke-width="1.5"/><text x="446" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#5b6675">01</text><text x="446" y="143" text-anchor="middle" font-size="9" fill="#5b6675">Wake</text><text x="446" y="153" text-anchor="middle" font-size="9" fill="#5b6675">RB-CAN</text><rect x="476" y="112" width="52" height="46" rx="3" fill="#2d8a4e" stroke="#2d8a4e" stroke-width="1.5"/><text x="502" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">02</text><text x="502" y="143" text-anchor="middle" font-size="9" fill="#fff">TV sound</text><text x="502" y="153" text-anchor="middle" font-size="9" fill="#fff">right</text><rect x="532" y="112" width="52" height="46" rx="3" fill="#2d8a4e" stroke="#2d8a4e" stroke-width="1.5"/><text x="558" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">03</text><text x="558" y="143" text-anchor="middle" font-size="9" fill="#fff">TV sound</text><text x="558" y="153" text-anchor="middle" font-size="9" fill="#fff">ground</text><rect x="588" y="112" width="52" height="46" rx="3" fill="#fff" stroke="#c7cfd9" stroke-width="1.5"/><text x="614" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#5b6675">04</text><text x="614" y="143" text-anchor="middle" font-size="9" fill="#5b6675">AUX</text><text x="614" y="153" text-anchor="middle" font-size="9" fill="#5b6675">right</text><rect x="644" y="112" width="52" height="46" rx="3" fill="#fff" stroke="#c7cfd9" stroke-width="1.5"/><text x="670" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#5b6675">05</text><text x="670" y="143" text-anchor="middle" font-size="9" fill="#5b6675">AUX</text><text x="670" y="153" text-anchor="middle" font-size="9" fill="#5b6675">ground</text><rect x="700" y="112" width="52" height="46" rx="3" fill="#fff" stroke="#c7cfd9" 