<title>2. COMAND 2.0 rear connectors: pins this install uses</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker></defs>
