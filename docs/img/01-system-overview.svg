<text x="24" y="34" font-size="20" font-weight="600">1. System overview</text>
<rect x="370" y="190" width="220" height="170" rx="4" fill="#fbf7ea" stroke="#a8821a" stroke-width="2.5"/><text x="480.0" y="253.0" text-anchor="middle" font-weight="600">Laptop: ThinkPad L560</text><text x="480.0" y="271.0" text-anchor="middle" font-size="12" fill="#5b6675">Debian 13, COMAND software</text><text x="480.0" y="289.0" text-anchor="middle" font-size="12" fill="#5b6675">sway, CarPlay, Bluetooth</text><text x="480.0" y="307.0" text-anchor="middle" font-size="12" fill="#5b6675">GPS, voice, video</text><rect x="700" y="110" width="230" height="330" rx="4" fill="#f5f7fa" stroke="#1b2330" stroke-width="1.5"/><text x="815.0" y="253.0" text-anchor="middle" font-weight="600">COMAND 2.0</text><text x="815.0" y="271.0" text-anchor="middle" font-size="12" fill="#5b6675">screen, keys, sound</text><text x="815.0" y="289.0" text-anchor="middle" font-size="12" fill="#5b6675">(rear connectors:</text><text x="815.0" y="307.0" text-anchor="middle" font-size="12" fill="#5b6675">diagram 2)</text><polyline points="590,225 700,225" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/><text x="645" y="214" text-anchor="middle" fill="#c0392b" font-size="13" font-weight="600">Video</text><text x="645" y="243" text-anchor="middle" fill="#5b6675" font-size="11" font-weight="400">VGA + combiner</text><polyline points="590,275 700,275" fill="none" stroke="#2d8a4e" stroke-width="3" marker-end="url(#a)"/><text x="645" y="264" text-anchor="middle" fill="#2d8a4e" font-size="13" font-weight="600">Sound</text><text x="645" y="293" text-anchor="middle" fill="#5b6675" font-size="11" font-weight="400">headphone jack</text><rect x="370" y="420" width="220" height="60" rx="4" fill="#f5f7fa" stroke="#2f62b5" stroke-width="1.5"/><text x="480.0" y="446.0" text-anchor="middle" font-weight="600">CANable 1.0</text><text x="480.0" y="464.0" text-anchor="middle" font-size="12" fill="#5b6675">Open-TV-COMAND firmware</text><polyline points="590,450 815,450 815,440" fill="none" stroke="#2