<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" fill="#1b2330">
<title>5. Sound: laptop to COMAND's TV sound input</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker></defs>
<rect width="960" height="430" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="600">5. Sound: laptop to COMAND's TV sound input</text>
<rect x="40" y="90" width="210" height="220" rx="4" fill="#f5f7fa" stroke="#1b2330" stroke-width="1.5"/><text x="145.0" y="187.0" text-anchor="middle" font-weight="600">Headphone jack</text><text x="145.0" y="205.0" text-anchor="middle" font-size="12" fill="#5b6675">3.5 mm stereo</text><text x="145.0" y="223.0" text-anchor="middle" font-size="12" fill="#5b6675">on the L560</text><rect x="690" y="90" width="230" height="220" rx="4" fill="#f5f7fa" stroke="#1b2330" stroke-width="1.5"/><text x="805.0" y="196.0" text-anchor="middle" font-weight="600">COMAND C2</text><text x="805.0" y="214.0" text-anchor="middle" font-size="12" fill="#5b6675">TV sound input</text><polyline points="250,130 690,130" fill="none" stroke="#2d8a4e" stroke-width="2.5"/><text x="258" y="123" text-anchor="start" fill="#1b2330" font-size="13" font-weight="400">Tip: left</text><text x="682" y="123" text-anchor="end" fill="#2d8a4e" font-size="13" font-weight="600">Pin 11  left</text><polyline points="250,180 690,180" fill="none" stroke="#2d8a4e" stroke-width="2.5"/><text x="258" y="173" text-anchor="start" fill="#1b2330" font-size="13" font-weight="400">Ring: right</text><text x="682" y="173" text-anchor="end" fill="#2d8a4e" font-size="13" font-weight="600">Pin 02  right</text><polyline points="250,230 690,230" fill="none" stroke="#555" stroke-width="2.5"/><text x="258" y="223" text-anchor="start" fill="#1b2330" font-size="13" font-weight="400">Sleeve: ground</text><text x="682" y="223" text-anchor="end" fill="#555" font-size="13" font-weight="600">Pin 03  ground (right)</text><polyline points="560,230 560,280 690,280" fill="none" stroke="#555" stroke-width="2.5"/><circle cx="560" cy="230" r="4.5" fill="#555"/><text x="682" y="272" text-anchor="end" fill="#555" font-size="13" font-weight="600">Pin 12  ground (left)</text><text x="550" y="297" text-anchor="end" fill="#5b6675" font-size="12" font-weight="400">and the cable shield</text><text x="40" y="340" text-anchor="start" fill="#b3261e" font-size="13" font-weight="600">Connect BOTH audio grounds, pin 03 (right) and pin 12 (left). With only one, a channel is weak, missing or hums.</text><text x="40" y="368" text-anchor="start" fill="#1b2330" font-size="13" font-weight="400">Set volume on the laptop in Settings > Volume. Long-press * on COMAND to open its TV sound settings.</text><text x="40" y="390" text-anchor="start" fill="#5b6675" font-size="13" font-weight="400">If you hear a hum, power the laptop and COMAND from one ground point before adding any filter.</text></svg>
