<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" fill="#1b2330">
<title>4. CAN wiring: COMAND's keys and TV mode</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker></defs>
<rect width="960" height="430" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="600">4. CAN wiring: COMAND's keys and TV mode</text>
<rect x="40" y="110" width="210" height="190" rx="4" fill="#f5f7fa" stroke="#1b2330" stroke-width="1.5"/><text x="145.0" y="201.0" text-anchor="middle" font-weight="600">ThinkPad L560</text><text x="145.0" y="219.0" text-anchor="middle" font-size="12" fill="#5b6675">USB: keyboard + serial</text><rect x="350" y="110" width="230" height="190" rx="4" fill="#f5f7fa" stroke="#2f62b5" stroke-width="1.5"/><text x="465.0" y="192.0" text-anchor="middle" font-weight="600">CANable 1.0</text><text x="465.0" y="210.0" text-anchor="middle" font-size="12" fill="#5b6675">Open-TV-COMAND firmware</text><text x="465.0" y="228.0" text-anchor="middle" font-size="12" fill="#5b6675">(section 5 of the guide)</text><rect x="690" y="90" width="230" height="230" rx="4" fill="#f5f7fa" stroke="#1b2330" stroke-width="1.5"/><text x="805.0" y="210.0" text-anchor="middle" font-weight="600">COMAND C2</text><polyline points="250,205 350,205" fill="none" stroke="#5b6675" stroke-width="3"/><text x="300" y="195" text-anchor="middle" fill="#5b6675" font-size="12" font-weight="600">USB</text><polyline points="580,150 690,150" fill="none" stroke="#2f62b5" stroke-width="2.5"/><text x="590" y="142" text-anchor="start" fill="#1b2330" font-size="13" font-weight="400">CAN H</text><text x="682" y="142" text-anchor="end" fill="#2f62b5" font-size="13" font-weight="600">Pin 18</text><polyline points="580,200 690,200" fill="none" stroke="#2f62b5" stroke-width="2.5" stroke-dasharray="6 4"/><text x="590" y="192" text-anchor="start" fill="#1b2330" font-size="13" font-weight="400">CAN L</text><text x="682" y="192" text-anchor="end" fill="#2f62b5" font-size="13" font-weight="600">Pin 17</text><polyline points="580,250 690,250" fill="none" stroke="#5b6675" stroke-width="2"/><text x="590" y="242" text-anchor="start" fill="#1b2330" font-size="13" font-weight="400">Shield</text><text x="682" y="242" text-anchor="end" fill="#5b6675" font-size="13" font-weight="600">Pin 16</text><text x="40" y="350" text-anchor="start" fill="#1b2330" font-size="13" font-weight="400">Twist H and L together. The media bus runs at 83.3 kbit/s; the firmware sets this itself.</text><text x="40" y="374" text-anchor="start" fill="#c0392b" font-size="13" font-weight="600">Connect it to the media bus only (17/18). Pins 8/9 are the interior CAN-B bus: it needs a different, fault-tolerant</text><text x="40" y="394" text-anchor="start" fill="#c0392b" font-size="13" font-weight="600">transceiver and is not required. An ordinary adapter upsets COMAND's CAN-B after about 100 frames.</text></svg>
