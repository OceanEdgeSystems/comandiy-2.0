<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" fill="#1b2330">
<title>3b. Sync combiner schematic</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker></defs>
<rect width="760" height="500" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="600">3b. Sync combiner schematic</text>
<text x="40" y="114" text-anchor="start" fill="#1b2330" font-size="13" font-weight="400">V sync</text><text x="40" y="130" text-anchor="start" fill="#5b6675" font-size="11" font-weight="400">VGA pin 14</text><polyline points="115,120 380,120 380,188" fill="none" stroke="#1b2330" stroke-width="2"/><rect x="220" y="111" width="56" height="18" fill="#fff" stroke="#1b2330" stroke-width="2"/><text x="248" y="105" text-anchor="middle" fill="#1b2330" font-size="13" font-weight="400">R1  100 Ω</text><text x="40" y="206" text-anchor="start" fill="#1b2330" font-size="13" font-weight="400">H sync</text><text x="40" y="222" text-anchor="start" fill="#5b6675" font-size="11" font-weight="400">VGA pin 13</text><polyline points="115,212 345,212" fill="none" stroke="#1b2330" stroke-width="2"/><rect x="210" y="203" width="56" height="18" fill="#fff" stroke="#1b2330" stroke-width="2"/><text x="238" y="197" text-anchor="middle" fill="#1b2330" font-size="13" font-weight="400">R2  10 kΩ</text><circle cx="368" cy="212" r="30" fill="none" stroke="#1b2330" stroke-width="2"/><polyline points="345,190 345,234" fill="none" stroke="#1b2330" stroke-width="3.5"/><polyline points="345,202 380,186" fill="none" stroke="#1b2330" stroke-width="2"/><polyline points="345,222 380,238" fill="none" stroke="#1b2330" stroke-width="2" marker-end="url(#a)"/><text x="408" y="206" text-anchor="start" fill="#1b2330" font-size="14" font-weight="600">Q1  2N3904</text><text x="408" y="224" text-anchor="start" fill="#5b6675" font-size="12" font-weight="400">NPN</text><text x="392" y="170" text-anchor="start" fill="#5b6675" font-size="11" font-weight="400">C</text><text x="322" y="206" text-anchor="start" fill="#5b6675" font-size="11" font-weight="400">B</text><text x="392" y="252" text-anchor="start" fill="#5b6675" font-size="11" font-weight="400">E</text><polyline points="380,238 380,400" fill="none" stroke="#1b2330" stroke-width="2"/><circle cx="380" cy="290" r="3.5" fill="#1b2330"/><rect x="371" y="322" width="18" height="46" fill="#fff" stroke="#1b2330" stroke-width="2"/><text x="396" y="349" text-anchor="start" fill="#1b2330" font-size="13" font-weight="400">R4  1 kΩ</text><polyline points="380,290 520,290" fill="none" stroke="#1b2330" stroke-width="2"/><rect x="440" y="281" width="56" height="18" fill="#fff" stroke="#1b2330" stroke-width="2"/><text x="468" y="275" text-anchor="middle" fill="#1b2330" font-size="13" font-weight="400">R3  470 Ω</text><polyline points="520,290 600,290" fill="none" stroke="#1b2330" stroke-width="2"/><text x="608" y="286" text-anchor="start" fill="#1b2330" font-size="13" font-weight="600">RGB Sync</text><text x="608" y="304" text-anchor="start" fill="#5b6675" font-size="11" font-weight="400">to COMAND</text><polyline points="60,400 700,400" fill="none" stroke="#555" stroke-width="2.5"/><text x="40" y="392" text-anchor="start" fill="#1b2330" font-size="13" font-weight="600">Ground</text><text x="40" y="424" text-anchor="start" fill="#5b6675" font-size="12" font-weight="400">VGA 5, 6, 7, 8, 10 and COMAND RGB GND + RGB A.G.</text><text x="40" y="450" text-anchor="start" fill="#b3261e" font-size="13" font-weight="600">Shield the circuit: put it in a small metal box or wrap it in grounded foil, and use screened cable.</text><text x="40" y="472" text-anchor="start" fill="#b3261e" font-size="13" font-weight="400">Connect the shield to the video ground. Unshielded, the sync picks up noise and the picture rolls, tears or flickers.</text><text x="40" y="492" text-anchor="start" fill="#5b6675" font-size="12" font-weight="400">Works only with negative sync polarity; the installed display mode uses it (-hsync -vsync).</text></svg>
