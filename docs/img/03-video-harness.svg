<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" fill="#1b2330">
<title>3. Video harness: laptop VGA to COMAND TV / RGB</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker></defs>
<rect width="960" height="520" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="600">3. Video harness: laptop VGA to COMAND TV / RGB</text>
<rect x="40" y="70" width="180" height="410" rx="4" fill="#f5f7fa" stroke="#1b2330" stroke-width="1.5"/><text x="130.0" y="271.0" text-anchor="middle" font-weight="600">VGA plug</text><text x="130.0" y="289.0" text-anchor="middle" font-size="12" fill="#5b6675">(HD-15, laptop side)</text><rect x="740" y="70" width="180" height="410" rx="4" fill="#f5f7fa" stroke="#1b2330" stroke-width="1.5"/><text x="830.0" y="271.0" text-anchor="middle" font-weight="600">COMAND</text><text x="830.0" y="289.0" text-anchor="middle" font-size="12" fill="#5b6675">TV / RGB block</text><polyline points="220,120 740,120" fill="none" stroke="#c0392b" stroke-width="2.5"/><text x="228" y="114" text-anchor="start" fill="#c0392b" font-size="13" font-weight="600">Pin 1  Red</text><text x="732" y="114" text-anchor="end" fill="#c0392b" font-size="13" font-weight="600">R</text><polyline points="220,170 740,170" fill="none" stroke="#2d8a4e" stroke-width="2.5"/><text x="228" y="164" text-anchor="start" fill="#2d8a4e" font-size="13" font-weight="600">Pin 2  Green</text><text x="732" y="164" text-anchor="end" fill="#2d8a4e" font-size="13" font-weight="600">G</text><polyline points="220,220 740,220" fill="none" stroke="#2f62b5" stroke-width="2.5"/><text x="228" y="214" text-anchor="start" fill="#2f62b5" font-size="13" font-weight="600">Pin 3  Blue</text><text x="732" y="214" text-anchor="end" fill="#2f62b5" font-size="13" font-weight="600">B</text><rect x="340" y="270" width="280" height="90" rx="4" fill="#fbf7ea" stroke="#a8821a" stroke-width="1.5"/><text x="480.0" y="311.0" text-anchor="middle" font-weight="600">Sync combiner</text><text x="480.0" y="329.0" text-anchor="middle" font-size="12" fill="#5b6675">diagram 3b, one small board</text><polyline points="220,290 340,290" fill="none" stroke="#1b2330" stroke-width="2"/><text x="228" y="284" text-anchor="start" fill="#1b2330" font-size="13" font-weight="400">Pin 13  H sync</text><polyline points="220,335 340,335" fill="none" stroke="#1b2330" stroke-width="2"/><text x="228" y="329" text-anchor="start" fill="#1b2330" font-size="13" font-weight="400">Pin 14  V sync</text><polyline points="620,315 740,315" fill="none" stroke="#1b2330" stroke-width="2"/><text x="732" y="309" text-anchor="end" fill="#1b2330" font-size="13" font-weight="400">RGB Sync</text><polyline points="220,400 740,400" fill="none" stroke="#555" stroke-width="2.5"/><text x="228" y="394" text-anchor="start" fill="#1b2330" font-size="13" font-weight="400">Pins 5, 6, 7, 8, 10  (all grounds, joined)</text><text x="732" y="394" text-anchor="end" fill="#1b2330" font-size="13" font-weight="400">RGB GND</text><circle cx="610" cy="400" r="3.5" fill="#1b2330"/><polyline points="610,400 610,445 740,445" fill="none" stroke="#555" stroke-width="2.5"/><text x="732" y="439" text-anchor="end" fill="#c0392b" font-size="13" font-weight="700">RGB A.G.</text><circle cx="480" cy="400" r="3.5" fill="#1b2330"/><polyline points="480,400 480,360" fill="none" stroke="#555" stroke-width="2"/><text x="490" y="384" text-anchor="start" fill="#5b6675" font-size="12" font-weight="400">combiner ground</text><text x="228" y="462" text-anchor="start" fill="#c0392b" font-size="13" font-weight="600">Leave pin 9 (+5 V) and pins 4, 11, 12, 15 unconnected.</text></svg>
