# Head unit compositor: Android below, our UI floating above it.
#
# cage was enough while the screen showed one thing at a time, but it hosts
# exactly one client, which is why the menu and Android had to take turns.
# sway is wlroots too -- so wayvnc still works -- and can stack them.
#
# The arrangement:
#   Waydroid   fullscreen, the whole screen, the thing you actually look at
#   cog        floating, same size, transparent background, always on top
#
# The overlay is transparent until it has something to say -- the volume popup
# while the knob is turning, the menu while the knob holds it open -- so for
# most of the time Android is unobstructed and the overlay is not visible at
# all. It is still there, which matters below.

### output ###############################################################
# No gaps: anything the overlay does not draw should be Android. The only
# wallpaper is the boot still (boot-splash/), which is what the panel shows in
# the second between Plymouth letting go and the overlay's first paint -- the
# overlay's splash animation starts from that same picture.
output * bg /usr/local/share/comand-ui/boot-frame.png fill

### no desktop furniture #################################################
default_border none
default_floating_border none
titlebar_padding 1
gaps inner 0
gaps outer 0
focus_follows_mouse no
# A car dashboard has no pointer. Hiding it stops a stray cursor sitting on
# the map, and there is nothing here that needs one.
seat * hide_cursor 1

### sources, one per workspace ###########################################
# Workspace 3 is the main menu, and it is deliberately empty: the menu is the
# overlay, drawn over nothing. Making it a source rather than a mode means the
# menu is somewhere you can be, and going back to it is the same workspace
# switch as going to CarPlay -- rather than a special case that has to hide
# whatever was underneath.
# CarPlay and Android are sources, and only one is on screen at a time. That
# is a workspace switch, which is one message and leaves the other source
# running untouched -- a CarPlay session survives a look at the map, and a
# route survives a look at CarPlay.
#
# The overlay is not on either: a layer-shell surface belongs to the output
# rather than a workspace, so it stays put across every switch.
# Both spellings. Waydroid names its surface "Waydroid" for the full UI and
# "waydroid.<package>" once an app owns the window, so a rule matching only the
# first silently stops applying the moment an app is launched into it. It landed
# on workspace 1 anyway, by being the default -- which is luck, not placement,
# and would have put Android on the CarPlay workspace had that been focused.
assign [app_id="^([Ww]aydroid|waydroid\..*)$"] workspace 1
assign [app_id="gst-launch-1.0"] workspace 2
# The phone's screen, mirrored. uxplay draws through GStreamer's waylandsink,
# which names its surface after whichever of the two is asked; both are
# matched so the window lands here rather than wherever it opened.
assign [app_id="^(uxplay|waylandsink|UxPlay)$"] workspace 4

for_window [app_id="gst-launch-1.0"] {
    fullscreen enable
    inhibit_idle open
}

for_window [app_id="^(uxplay|waylandsink|UxPlay)$"] {
    fullscreen enable
    inhibit_idle open
}



### the two clients ######################################################
# Android. Waydroid's surface, made to fill the screen.
# Android can be fullscreen again now that the overlay is a layer-shell
# surface: the overlay layer is drawn above fullscreen windows by definition.
# It could not be while the overlay was an ordinary floating window, because
# sway draws fullscreen windows above floating ones and Android hid the
# overlay completely -- still running, still updating, invisible.
for_window [app_id="^([Ww]aydroid|waydroid\..*)$"] {
    fullscreen enable
    inhibit_idle focus
}

### startup ##############################################################
# Start on the menu, not on a source. Which source the car ends up on is the
# bridge's decision -- it knows whether CarPlay auto-connect is set -- and it
# switches away from here if so. Starting on a source and switching back would
# show Android for a second on every boot.
workspace 3

# Android first, so it is the bottom of the stack when the overlay appears.
#
# The session is stopped before it is started. A Waydroid session outlives the
# compositor that created it, and its surface belongs to that dead compositor,
# so `show-full-ui` against a session from a previous sway does nothing
# visible: the container reports RUNNING, no window ever appears, and switching
# to its workspace shows an empty screen. Stopping first makes the surface
# belong to the sway that is actually running.
#
# The 8 s wait is for the boot splash: Android's start-up is the heaviest thing
# the box does, and started 3 s in it landed in the middle of the overlay's
# animation and made it stutter. 8 s lets the animation finish first.
exec sh -c 'waydroid session stop >/dev/null 2>&1; sleep 8; exec waydroid show-full-ui' 

# The overlay, once there is something to sit on top of. --bg-color with an
# alpha of 00 is what makes the page transparent rather than black; the page
# itself keeps every surface transparent in overlay mode.
# The overlay: a layer-shell surface, not a window, so it can be click-through.
#
# LD_PRELOAD is handled by the script itself (it re-execs), because
# gtk4-layer-shell must be loaded before GTK touches libwayland or its hooks
# never install and every layer call fails with "GtkWindow is not a layer
# surface" -- which reads like a missing init call rather than a load order.
#
# Started as soon as the bridge serves the page (the overlay loads it once and
# never retries the load); the event stream reconnects on its own. It used to
# wait a flat 10 s, which with WebKit's 25 s portal stall (see
# boot-splash/README.md) made the menu take ~40 s to appear.
# (No $ in here: sway expands $names in its config.)
exec sh -c 'timeout 10 sh -c "until curl -sf -o /dev/null http://127.0.0.1:8080/state; do sleep 0.1; done"; exec python3 /usr/local/share/comand-ui/comand-overlay.py'


