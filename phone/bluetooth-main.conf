# /etc/bluetooth/main.conf for the car.
#
# A head unit is discoverable and pairable permanently. The usual reason to
# time those out is a laptop that should not sit advertising itself in a cafe;
# a car that stops being pairable five minutes after boot is a car where
# pairing a new phone means finding a menu first.
[General]
Name = @CAR_NAME@
Class = 0x200420
DiscoverableTimeout = 0
PairableTimeout = 0
# Phones expect a car kit to be able to re-establish the link itself after the
# ignition, rather than waiting to be connected from the phone every time.
ReconnectAttempts = 7
ReconnectIntervals = 1,2,4,8,16,32,64

[Policy]
# Reconnect audio profiles when the phone comes back into range.
AutoEnable = true
ReconnectUUIDs = 0000110b-0000-1000-8000-00805f9b34fb,0000111e-0000-1000-8000-00805f9b34fb
