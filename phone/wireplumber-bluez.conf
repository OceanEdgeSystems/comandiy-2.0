# Hands-free audio through oFono, installed as
# /etc/wireplumber/wireplumber.conf.d/50-comand-bluez.conf
#
# WirePlumber can run HFP itself, and for a headset that is the right choice.
# For a car it is not: its own backend owns the RFCOMM link to the phone and
# offers no way to place a call, and a head unit that can hear a call but not
# make one is not a telephone. oFono owns that link instead and exposes it as
# a modem on D-Bus -- Dial, Answer, Hangup, and the call state as it changes.
#
# Roles are from the car's point of view. The phone is the audio gateway; we
# are the hands-free unit, and we receive its music rather than sending any.
monitor.bluez.properties = {
  bluez5.roles = [ hfp_hf a2dp_sink avrcp_controller ]
  bluez5.hfphsp-backend = "ofono"

  # Every codec the box can decode, best first. The phone picks from what it
  # is offered, so offering everything is how an Android gets LDAC and an
  # iPhone still gets something better than baseline.
  #
  #   ldac      Android's best; 660/990 kbps against SBC's 328
  #   aptx_hd   24-bit, for phones that have it and not LDAC
  #   aptx      still better than baseline SBC
  #   sbc_xq    SBC at a bitpool nobody negotiates by default. This is what an
  #             iPhone gets, because Debian's PipeWire has no AAC plugin --
  #             fdk-aac is not in the archive -- and Apple does not do LDAC or
  #             aptX. Roughly doubles SBC's bitrate.
  #   sbc       the floor every device agrees on
  bluez5.codecs = [ ldac aptx_hd aptx sbc_xq sbc msbc ]
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true

  # LDAC at its best rather than adaptive. A car sits still relative to the
  # phone in it, so the interference that makes adaptive worth having is not
  # there, and dropping quality on a link that is not struggling is a cost for
  # nothing.
  bluez5.a2dp.ldac.quality = "hq"
}

# Never suspend the devices a call runs through.
#
# PipeWire suspends nodes it considers idle, and that is right for a laptop's
# speakers. It is wrong for a car in the middle of a phone call: the far end
# could hear the car at the start of a call and not a few seconds later, which
# is what a microphone suspended out from under a live call sounds like.
#
# The loopbacks in phone/call-audio.py are real clients and should keep these
# awake on their own. This is the belt to that pair of braces, because the
# failure it prevents is one nobody can diagnose from the driver's seat.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_input.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]

monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
