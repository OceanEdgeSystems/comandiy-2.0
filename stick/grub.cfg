# COMAND USB installer. Boots Debian's hd-media installer, which finds the
# netinst ISO and preseed.cfg on this stick.
if loadfont $prefix/font.pf2 ; then
  set gfxmode=800x600
  set gfxpayload=keep
  insmod efi_gop
  insmod gfxterm
  terminal_output gfxterm
fi
set timeout=10
set default=0

menuentry 'Install COMAND (erases the disk you choose)' {
    linux  /hd-media/vmlinuz auto=true priority=critical preseed/file=/hd-media/preseed.cfg --- quiet
    initrd /hd-media/initrd.gz
}
menuentry 'Install Debian 13 (manual, ignores the COMAND settings)' {
    linux  /hd-media/vmlinuz --- quiet
    initrd /hd-media/initrd.gz
}
menuentry 'Rescue mode' {
    linux  /hd-media/vmlinuz rescue/enable=true --- quiet
    initrd /hd-media/initrd.gz
}
menuentry 'UEFI firmware settings' {
    fwsetup
}
