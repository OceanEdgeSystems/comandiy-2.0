# MPD for the head unit: internet radio now, local files when there are any.
#
# Runs as the session user rather than the `mpd` system user, because the audio
# sink belongs to that user's PipeWire session. A system-wide mpd would have no
# route to it and would fail in a way that reads like a broken stream.
#
# OUTPUT
# PipeWire, not ALSA directly. Everything else on this box -- CarPlay audio,
# Android, prompts -- goes through PipeWire, and a second thing taking the ALSA
# device exclusively would silence whichever got there second. Sharing the
# graph is the whole point.
#
# The sink today is HDMI, which does not reach the car: the HDMI feed goes to
# the AG6200 and comes out as RGB video. A USB DAC into COMAND's aux is the
# intended path, and when it is fitted this file does not change -- PipeWire's
# default sink moves and MPD follows it.

music_directory     "/var/lib/comand/music"
playlist_directory  "/var/lib/comand/playlists"
db_file             "/var/lib/comand/mpd/database"
state_file          "/var/lib/comand/mpd/state"
sticker_file        "/var/lib/comand/mpd/sticker.sql"

bind_to_address     "127.0.0.1"
port                "6600"

# Radio streams stall, and a car loses signal in tunnels and cuttings. Fail
# fast and let the caller retry rather than blocking the daemon for a minute.
connection_timeout  "10"

# Metadata from stream titles is how "now playing" works for radio: there are
# no tags, only ICY titles.
metadata_to_use     "artist,album,title,name"

audio_output {
    type            "pipewire"
    name            "COMAND"
}

# No mixer here. Volume is the head unit's, applied to the PipeWire sink by the
# bridge so that one knob governs radio, CarPlay and Android alike. An MPD
# mixer would move only MPD and leave the knob lying about everything else.
replaygain          "off"
